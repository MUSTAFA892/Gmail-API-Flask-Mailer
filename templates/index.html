<!DOCTYPE html>
<html>
<head><title>Send Email</title></head>
<body>
  <h2>Send Email</h2>
  <p>Logged in as: {{ user_email }}</p>
  <form method="POST" action="{{ url_for('send') }}" enctype="multipart/form-data">
    To: <input type="email" name="to" required><br>
    Reply-To: <input type="email" name="reply_to"><br>
    Subject: <input type="text" name="subject"><br>
    Body:<br><textarea name="body"></textarea><br>
    Attachments: <input type="file" name="attachments" multiple><br>
    <button type="submit">Send</button>
  </form>
  <p><a href="{{ url_for('logout') }}">Logout</a></p>
</body>
</html>
