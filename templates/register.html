<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - MailSender Pro</title>
  <style>
    :root {
      --primary-color: #5a3bff;
      --primary-hover: #7b61ff;
      --background-color: #1c1e22;
      --card-background: #25272b;
      --text-color: #e6e6e6;
      --text-muted: #a0a5b0;
      --border-color: #3a3f47;
      --error-color: #ff4d4f;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(180deg, #1c1e22 0%, #25272b 100%);
      color: var(--text-color);
      font-family: var(--font-stack);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    h2 {
      font-size: 2rem;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      margin-bottom: 1rem;
      animation: fadeIn 0.8s ease-out;
    }

    .email-form-container {
      background: var(--card-background);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      animation: slideUp 0.8s ease-out;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 500;
      font-size: 0.95rem;
    }

    input[type="email"] {
      background: #2f3238;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
    }

    input[type="email"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(90, 59, 255, 0.2);
      outline: none;
      transform: translateY(-2px);
    }

    .alert {
      background-color: rgba(255, 77, 79, 0.1);
      color: var(--error-color);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      border: 1px solid var(--error-color);
    }

    button {
      background: linear-gradient(90deg, var(--primary-color), var(--primary-hover));
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    button:hover {
      background: linear-gradient(90deg, var(--primary-hover), #9b81ff);
      transform: translateY(-2px);
    }

    p {
      text-align: center;
      margin-top: 1rem;
      color: var(--text-muted);
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
    }

    a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="email-form-container">
    <h2>Register</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>
      <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</body>
</html>
