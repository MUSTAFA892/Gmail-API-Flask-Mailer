<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MailSender Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box login-animation">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-paper-plane"></i>
                    <h1>MailSender Pro</h1>
                </div>
                <div class="theme-toggle">
                    <button id="theme-btn" aria-label="Toggle theme">
                        <i class="fas fa-sun light-icon"></i>
                        <i class="fas fa-moon dark-icon"></i>
                    </button>
                </div>
            </div>

            <div class="auth-content">
                <div class="envelope-animation">
                    <div class="envelope">
                        <div class="envelope-front"></div>
                        <div class="envelope-back"></div>
                        <div class="envelope-top"></div>
                        <div class="envelope-letter">
                            <div class="letter-lines">
                                <div class="letter-line"></div>
                                <div class="letter-line"></div>
                                <div class="letter-line"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to access your email dashboard</p>

                <div class="flash-messages">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }}">
                            <i class="{% if category == 'success' %}fas fa-check-circle{% elif category == 'error' %}fas fa-exclamation-circle{% else %}fas fa-info-circle{% endif %}"></i>
                            {{ message }}
                            <button class="close-alert">×</button>
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}
                </div>

                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <input type="email" id="email" name="email" required autofocus>
                    </div>

                    <button type="submit" class="auth-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>
                </form>

                <div class="auth-links">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
